<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Utilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=tool-subtitles-1">
</head>
<body>
  <main class="card">
    <header><img src="assets/easilLogo.png" alt="" width="24" height="24"><h1>Design Utilities</h1></header>
    <nav aria-label="Design utilities">
      <a href="shape-mask/"><img class="tool-icon" src="assets/icons/shape-mask.png" alt="" width="72" height="72"><span class="tool-copy"><span class="tool-name">Shape Mask<br>Converter</span><span class="tool-subtitle">Create image masks from vector shapes</span></span><span class="chevron" aria-hidden="true"></span></a>
      <a href="stretch-repeat/"><img class="tool-icon" src="assets/icons/stretch-repeat.png" alt="" width="72" height="72"><span class="tool-copy"><span class="tool-name">Stretch &amp; Repeat<br>Converter</span><span class="tool-subtitle">Repeat a centre section with fixed endcaps</span></span><span class="chevron" aria-hidden="true"></span></a>
      <a href="repeat/"><img class="tool-icon" src="assets/icons/repeat.png" alt="" width="72" height="72"><span class="tool-copy"><span class="tool-name">Repeating<br>Shape Converter</span><span class="tool-subtitle">Turn artwork into a horizontal repeat</span></span><span class="chevron" aria-hidden="true"></span></a>
      <a href="stretchable/"><img class="tool-icon" src="assets/icons/stretchable.png" alt="" width="72" height="72"><span class="tool-copy"><span class="tool-name">Stretchable<br>Shape Converter</span><span class="tool-subtitle">Stretch artwork horizontally, vertically or both</span></span><span class="chevron" aria-hidden="true"></span></a>
    </nav>
  </main>
  <script>
    window.setTimeout(() => {
      const link = document.createElement('a');
      link.href = '../basketball/';
      link.innerHTML = '<img class="tool-icon" src="assets/icons/basketball.png" alt="" width="72" height="72"><span class="tool-copy"><span class="tool-name">Secret Basketball Game</span><span class="tool-subtitle">Hoops of Fun</span></span><span class="chevron" aria-hidden="true"></span>';
      const reveal = document.createElement('div');
      reveal.className = 'secret-reveal';
      reveal.append(link);
      const animate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (animate) {
        reveal.style.height = '0px';
        reveal.style.overflow = 'hidden';
      }
      document.querySelector('nav[aria-label="Design utilities"]').append(reveal);

      if (animate) {
        const height = link.getBoundingClientRect().height + parseFloat(getComputedStyle(link).marginTop);
        const expand = reveal.animate(
          [{ height: '0px' }, { height: height + 'px' }],
          { duration: 600, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'forwards' }
        );
        link.animate(
          [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 450, delay: 120, easing: 'ease-out', fill: 'backwards' }
        );
        expand.onfinish = () => {
          reveal.style.removeProperty('height');
          reveal.style.removeProperty('overflow');
          expand.cancel();
        };
      }
    }, 10000);
  </script>
</body>
</html>
