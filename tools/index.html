<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Utilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=secret-reveal">
</head>
<body>
  <main class="card">
    <header><img src="assets/easilLogo.png" alt="" width="24" height="24"><h1>Design Utilities</h1></header>
    <nav aria-label="Design utilities">
      <a href="shape-mask/"><span>Shape Mask Converter</span><span aria-hidden="true">→</span></a>
      <a href="stretch-repeat/"><span>Stretch &amp; Repeat Converter</span><span aria-hidden="true">→</span></a>
      <a href="repeat/"><span>Repeating Element Maker</span><span aria-hidden="true">→</span></a>
      <a href="stretchable/"><span>Stretchable Shape Creator</span><span aria-hidden="true">→</span></a>
    </nav>
  </main>
  <script>
    window.setTimeout(() => {
      const link = document.createElement('a');
      link.href = '../basketball/';
      link.innerHTML = '<span>🏀 Secret Basketball Game</span><span aria-hidden="true">→</span>';
      const reveal = document.createElement('div');
      reveal.className = 'secret-reveal';
      reveal.append(link);
      const animate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (animate) {
        reveal.style.height = '0px';
        reveal.style.overflow = 'hidden';
      }
      document.querySelector('nav[aria-label="Design utilities"]').append(reveal);

      if (animate) {
        const height = link.getBoundingClientRect().height + 12;
        const expand = reveal.animate(
          [{ height: '0px' }, { height: height + 'px' }],
          { duration: 600, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'forwards' }
        );
        link.animate(
          [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 450, delay: 120, easing: 'ease-out', fill: 'backwards' }
        );
        expand.onfinish = () => {
          reveal.style.removeProperty('height');
          reveal.style.removeProperty('overflow');
          expand.cancel();
        };
      }
    }, 10000);
  </script>
</body>
</html>
